name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; only the deploy-config job below ever receives secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Fast checks run in parallel so a failure shows in minutes, not after a full build.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Tests are hermetic: vitest.config.ts supplies inert placeholder credentials and every database
  # call goes to an in-memory fake, so this job needs no secrets and cannot reach a real project.
  test:
    name: Unit and pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Migration files are well-formed
        run: npm run check:migrations

  # Known-vulnerable production dependencies fail the run. Dev-only advisories are reported, not blocking.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependencies (blocking at high)
        run: npm audit --omit=dev --audit-level=high
      - name: Dev dependencies (informational)
        run: npm audit --audit-level=critical || true

  build:
    name: Production build
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Next's compiler cache makes unchanged pages rebuild in seconds.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          # Build-time placeholders only. Real values live in the hosting provider.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_TELEMETRY_DISABLED: '1'
      # Keeps page weight from creeping up: a route over its first-load budget fails the build.
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs build.log

  # Runs only on main, and only when production secrets are exposed to a protected "production"
  # environment. Proves the production configuration is complete before anything is promoted.
  production-config:
    name: Production configuration check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, audit]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify required environment
        run: node scripts/verify-env.mjs
        env:
          VERIFY_ENV_STRICT: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RATE_LIMIT_REQUIRE_REDIS: ${{ vars.RATE_LIMIT_REQUIRE_REDIS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
